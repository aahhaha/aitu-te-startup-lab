<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClearQuestion</title>
<style>body{font:17px system-ui;max-width:800px;margin:3rem auto;padding:0 1rem;color:#182b3a;background:#f4f7fa}section,article{background:white;padding:1.3rem;margin:1rem 0;border-radius:12px}label{display:block;margin-top:1rem}input,textarea,button{font:inherit;padding:.65rem;box-sizing:border-box}input,textarea{width:100%}button{margin-top:.8rem;background:#125c80;color:white;border:0;border-radius:6px;cursor:pointer}small{display:block;color:#455b6a}#message{min-height:1.5rem}details{margin:2rem 0}a{color:#125c80}</style>
<h1>ClearQuestion</h1><p>Ask in writing. Keep the conversation going.</p>
<section><h2>Ask your question</h2><p id="privacy">Classmates do not see your name. The teacher managing this room can see it. Please do not include private information in the question itself.</p>
<form id="ask"><label for="author">Your name (visible to the teacher)</label><input id="author" required maxlength="80" autocomplete="off"><label for="question">Question</label><textarea id="question" required maxlength="500" rows="3"></textarea><button id="submit">Submit question</button></form><p id="message" role="status" aria-live="polite"></p></section>
<section><h2>Room R1 questions</h2><button id="refresh" type="button">Refresh questions</button><div id="questions"></div></section>
<details><summary>Teacher controls</summary><label for="teacher">Teacher key</label><input type="password" id="teacher" autocomplete="off"><button type="button" id="moderation">Load moderation queue</button><div id="queue"></div></details>
<script>
const el=id=>document.getElementById(id);let voter=sessionStorage.getItem('voter');if(!voter){voter=crypto.randomUUID();sessionStorage.setItem('voter',voter)}
async function api(path,data,key){const r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json',...(key?{'Authorization':'Bearer '+key}:{})},...(data?{body:JSON.stringify(data)}:{})});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
function line(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
async function refresh(){const rows=await api('/api/questions?room=R1');el('questions').replaceChildren();for(const q of rows){const a=document.createElement('article');a.append(line('h3',q.text),line('p',q.answer||'Awaiting teacher response'),line('small',q.votes+' votes | '+q.status));const b=line('button','Vote');b.onclick=async()=>{await api('/api/votes',{question_id:q.id,voter_id:voter});await refresh()};a.append(b);el('questions').append(a)}}
el('ask').onsubmit=async ev=>{ev.preventDefault();el('submit').disabled=true;try{await api('/api/questions',{room:'R1',author:el('author').value,text:el('question').value,request_id:crypto.randomUUID()});el('question').value='';el('message').textContent='Question submitted. Your name is hidden from classmates.';await refresh()}catch(e){el('message').textContent=e.message}finally{el('submit').disabled=false}};
el('refresh').onclick=()=>refresh().catch(e=>el('message').textContent=e.message);
el('moderation').onclick=async()=>{try{const key=el('teacher').value,rows=await api('/api/moderation?room=R1',null,key);el('queue').replaceChildren();for(const q of rows){const a=document.createElement('article');a.append(line('h3',q.text),line('p','Author: '+q.author));const answer=document.createElement('textarea');answer.setAttribute('aria-label','Teacher answer');a.append(answer);for(const [name,path,data] of [['Answer','/api/answer',{answer:''}],['Hide','/api/moderate',{action:'hide'}],['Reopen','/api/moderate',{action:'reopen'}]]){const b=line('button',name);b.onclick=async()=>{try{await api(path,{question_id:q.id,...data,...(name==='Answer'?{answer:answer.value}:{})},key);await refresh();el('message').textContent=name+' saved'}catch(e){el('message').textContent=e.message}};a.append(b)}el('queue').append(a)}}catch(e){el('message').textContent=e.message}};
refresh().catch(e=>el('message').textContent=e.message);
</script></html>
